<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ôn Luyện VSTEP cho BéIu</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
  <script src="js/data.js" defer></script>
  <script src="js/srs.js" defer></script>
  <script src="js/quiz.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#view">Bỏ qua đến nội dung chính</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/">
        <img class="brand-mark" src="assets/favicon.svg" alt="" width="32" height="32">
        <span class="brand-title">Ôn Luyện VSTEP cho BéIu</span>
      </a>

      <nav class="site-nav" aria-label="Điều hướng chính">
        <a href="#/" data-nav="home">Trang chủ</a>
        <a href="#/on-tap" data-nav="review">Ôn tập</a>
        <a href="#/tien-do" data-nav="progress">Tiến độ</a>
      </nav>

      <div class="streak-pill" title="Chuỗi ngày học liên tiếp">
        <svg class="streak-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M12 2l2.6 5.6 6.1.8-4.5 4.3 1.1 6.1L12 15.9l-5.3 2.9 1.1-6.1-4.5-4.3 6.1-.8z"/>
        </svg>
        <span id="streak-count">0</span>
        <span class="streak-label">ngày</span>
      </div>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="toast" class="toast" role="status" hidden></div>
  <div id="sr-live" class="sr-only" aria-live="polite"></div>

  <footer class="site-footer">
    <p>Nội dung từ tài liệu Từ vựng theo chủ đề. Dữ liệu học lưu trên máy này.</p>
  </footer>

  <template id="tpl-home">
    <section class="page home-page">
      <div class="hero-deck">
        <div class="hero-main">
          <h1 class="hero-title" data-field="greeting"></h1>
          <p class="hero-goal" data-field="goal-text"></p>
          <div class="meter" data-field="goal-meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="meter-fill" data-fill></span></div>
        </div>
        <div class="hero-actions">
          <p class="due-badge" data-field="due-count"></p>
          <div class="button-row">
            <button type="button" class="btn btn-primary" data-action="start-review">Ôn tập ngay</button>
            <button type="button" class="btn btn-secondary" data-action="start-new">Học từ mới</button>
          </div>
        </div>
      </div>

      <section class="home-section">
        <h2 class="section-title">Chủ đề từ vựng</h2>
        <ul class="topic-grid" data-field="topic-list"></ul>
      </section>

      <section class="home-section">
        <h2 class="section-title">Luyện nói phần 1</h2>
        <ul class="topic-grid" data-field="speaking-list"></ul>
      </section>
    </section>
  </template>

  <template id="tpl-topic-card">
    <li class="topic-card">
      <a class="topic-link" data-field="link" href="#/">
        <div class="topic-head">
          <img class="topic-icon" data-field="icon" alt="" width="48" height="48">
          <div class="topic-titles">
            <strong class="topic-vi" data-field="title-vi"></strong>
            <span class="topic-en" data-field="title-en" lang="en"></span>
          </div>
        </div>
        <div class="topic-meta">
          <span class="topic-count" data-field="count"></span>
          <span class="topic-mastery" data-field="mastery-text"></span>
        </div>
        <div class="meter" data-field="mastery-meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="meter-fill" data-fill></span></div>
      </a>
    </li>
  </template>

  <template id="tpl-topic">
    <section class="page topic-page">
      <a class="back-link" href="#/" data-field="back">← Về trang chủ</a>

      <header class="topic-banner">
        <h1 class="page-title" data-field="title-vi"></h1>
        <p class="page-subtitle" data-field="title-en" lang="en"></p>
        <p class="topic-stats" data-field="stats"></p>
      </header>

      <div class="mode-panel">
        <button type="button" class="btn btn-primary btn-smart" data-action="start-smart">Học thông minh</button>
        <div class="mode-grid" role="group" aria-label="Chọn chế độ học">
          <button type="button" class="btn btn-mode" data-mode="the">Thẻ ghi nhớ</button>
          <button type="button" class="btn btn-mode" data-mode="trac-nghiem">Trắc nghiệm</button>
          <button type="button" class="btn btn-mode" data-mode="nghe">Nghe chọn nghĩa</button>
          <button type="button" class="btn btn-mode" data-mode="go-tu">Gõ từ</button>
          <button type="button" class="btn btn-mode" data-mode="ghep-cap">Ghép cặp</button>
        </div>
      </div>

      <section class="topic-section">
        <h2 class="section-title">Danh sách từ vựng</h2>
        <ul class="word-list" data-field="word-list"></ul>
      </section>

      <section class="topic-section">
        <h2 class="section-title">Mẫu câu gợi ý</h2>
        <ul class="structure-list" data-field="structure-list"></ul>
      </section>
    </section>
  </template>

  <template id="tpl-word-row">
    <li class="word-row">
      <div class="word-main">
        <span class="word-en" data-field="en" lang="en"></span>
        <span class="word-vi" data-field="vi"></span>
        <span class="word-note" data-field="note"></span>
      </div>
      <div class="word-actions">
        <span class="box-tag" data-field="box"></span>
        <button type="button" class="btn-icon" data-action="speak" aria-label="Nghe phát âm">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.49 4.49 0 0 0 16.5 12zm-2.5-8.77v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/>
          </svg>
        </button>
      </div>
    </li>
  </template>

  <template id="tpl-structure-row">
    <li class="structure-row">
      <p class="structure-en" data-field="en" lang="en"></p>
      <p class="structure-vi" data-field="vi"></p>
    </li>
  </template>

  <template id="tpl-session">
    <section class="page session-page">
      <header class="session-header">
        <div class="session-top">
          <h1 class="session-title" data-field="title"></h1>
          <button type="button" class="btn btn-ghost" data-action="quit">Thoát</button>
        </div>
        <div class="session-progress-row">
          <span class="progress-text" data-field="progress-text"></span>
        </div>
        <div class="meter" data-field="progress-meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="meter-fill" data-fill></span></div>
      </header>

      <div class="session-stage" data-field="stage"></div>

      <div class="session-footer">
        <p class="session-feedback" data-field="feedback"></p>
        <button type="button" class="btn btn-primary btn-next" data-action="next" hidden>Câu tiếp theo</button>
      </div>
    </section>
  </template>

  <template id="tpl-q-card">
    <div class="q-card-wrap">
      <div class="flashcard-deck">
        <button type="button" class="flashcard" data-field="card" data-side="front">
          <span class="card-face card-front" data-field="front" lang="en"></span>
          <span class="card-face card-back" data-field="back"></span>
        </button>
      </div>
      <div class="card-tools">
        <button type="button" class="btn btn-secondary" data-action="speak">Nghe phát âm</button>
      </div>
      <div class="grade-row" role="group" aria-label="Tự chấm mức độ nhớ">
        <button type="button" class="btn btn-grade" data-grade="sai">Chưa nhớ</button>
        <button type="button" class="btn btn-grade" data-grade="gan-dung">Hơi nhớ</button>
        <button type="button" class="btn btn-grade" data-grade="dung">Đã nhớ</button>
      </div>
    </div>
  </template>

  <template id="tpl-q-choice">
    <div class="q-choice-wrap">
      <div class="question-card">
        <p class="question-direction" data-field="direction"></p>
        <p class="question-prompt" data-field="prompt"></p>
        <button type="button" class="btn btn-secondary" data-action="speak">Nghe phát âm</button>
      </div>
      <div class="choice-list">
        <button type="button" class="btn choice-btn" data-choice="0"></button>
        <button type="button" class="btn choice-btn" data-choice="1"></button>
        <button type="button" class="btn choice-btn" data-choice="2"></button>
        <button type="button" class="btn choice-btn" data-choice="3"></button>
      </div>
    </div>
  </template>

  <template id="tpl-q-listen">
    <div class="q-listen-wrap">
      <div class="question-card">
        <p class="question-direction">Nghe và chọn nghĩa đúng</p>
        <div class="button-row">
          <button type="button" class="btn btn-primary" data-action="speak">Nghe</button>
          <button type="button" class="btn btn-secondary" data-action="speak-slow">Nghe chậm</button>
        </div>
      </div>
      <div class="choice-list">
        <button type="button" class="btn choice-btn" data-choice="0"></button>
        <button type="button" class="btn choice-btn" data-choice="1"></button>
        <button type="button" class="btn choice-btn" data-choice="2"></button>
        <button type="button" class="btn choice-btn" data-choice="3"></button>
      </div>
    </div>
  </template>

  <template id="tpl-q-typing">
    <div class="q-typing-wrap">
      <div class="question-card">
        <p class="question-prompt" data-field="prompt"></p>
        <p class="typing-hint" data-field="hint" lang="en"></p>
        <div class="button-row">
          <button type="button" class="btn btn-secondary" data-action="hint">Gợi ý</button>
          <button type="button" class="btn btn-secondary" data-action="speak">Nghe phát âm</button>
        </div>
      </div>
      <form class="typing-form" data-field="form">
        <label class="typing-label">
          <span>Nhập từ hoặc cụm từ tiếng Anh</span>
          <input type="text" class="text-input" data-field="answer" autocomplete="off" autocapitalize="off" spellcheck="false" lang="en" placeholder="Gõ đáp án...">
        </label>
        <button type="submit" class="btn btn-primary">Kiểm tra</button>
      </form>
    </div>
  </template>

  <template id="tpl-q-match">
    <div class="q-match-wrap">
      <p class="question-direction">Chọn một từ tiếng Anh rồi nối với nghĩa tiếng Việt</p>
      <div class="match-columns">
        <ul class="match-list" data-field="left" lang="en"></ul>
        <ul class="match-list" data-field="right"></ul>
      </div>
    </div>
  </template>

  <template id="tpl-match-item">
    <li class="match-item">
      <button type="button" class="btn match-btn" data-field="btn"></button>
    </li>
  </template>

  <template id="tpl-summary">
    <section class="page summary-page">
      <div class="summary-card">
        <h1 class="page-title">Hoàn thành phiên học</h1>
        <p class="summary-score" data-field="score"></p>
        <p class="summary-detail" data-field="detail"></p>
        <div class="button-row">
          <button type="button" class="btn btn-primary" data-action="again">Học lại</button>
          <a class="btn btn-secondary" href="#/" data-action="home">Về trang chủ</a>
        </div>
      </div>
      <section class="summary-wrong">
        <h2 class="section-title">Các từ cần xem lại</h2>
        <ul class="word-list" data-field="wrong-list"></ul>
      </section>
    </section>
  </template>

  <template id="tpl-speaking">
    <section class="page speaking-page">
      <a class="back-link" href="#/" data-field="back">← Về trang chủ</a>

      <header class="speaking-header">
        <h1 class="page-title" data-field="title"></h1>
      </header>

      <div class="speaking-question-card">
        <span class="question-count" data-field="question-count"></span>
        <p class="question-en" data-field="question-en" lang="en"></p>
        <p class="question-vi" data-field="question-vi"></p>
        <div class="button-row">
          <button type="button" class="btn btn-secondary" data-action="speak">Nghe câu hỏi</button>
          <button type="button" class="btn btn-primary" data-action="next-question">Câu hỏi khác</button>
        </div>
      </div>

      <div class="speaking-tools">
        <div class="tool-box">
          <span class="timer-display" data-field="timer">0:45</span>
          <button type="button" class="btn btn-secondary" data-action="timer">Bắt đầu 45 giây</button>
        </div>
        <div class="tool-box">
          <button type="button" class="btn btn-secondary" data-action="record">Ghi âm thử</button>
          <p class="record-status" data-field="record-status"></p>
          <audio class="playback-audio" data-field="playback" controls hidden></audio>
        </div>
      </div>

      <div class="speaking-columns">
        <section class="speaking-section">
          <h2 class="section-title">Khung trả lời</h2>
          <ul class="outline-list" data-field="outline"></ul>
        </section>

        <section class="speaking-section">
          <h2 class="section-title">Ý gợi ý và cụm từ</h2>
          <ul class="ideas-list" data-field="ideas"></ul>
        </section>
      </div>
    </section>
  </template>

  <template id="tpl-outline-item">
    <li class="outline-item">
      <span class="outline-label" data-field="label"></span>
      <p class="outline-en" data-field="en" lang="en"></p>
      <p class="outline-vi" data-field="vi"></p>
    </li>
  </template>

  <template id="tpl-progress">
    <section class="page progress-page">
      <h1 class="page-title">Tiến độ và cài đặt</h1>

      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-label">Tổng số từ</span>
          <strong class="stat-value" data-field="total"></strong>
        </div>
        <div class="stat-box">
          <span class="stat-label">Đã học</span>
          <strong class="stat-value" data-field="learned"></strong>
        </div>
        <div class="stat-box">
          <span class="stat-label">Đã thuộc</span>
          <strong class="stat-value" data-field="mastered"></strong>
        </div>
        <div class="stat-box stat-streak">
          <span class="stat-label">Chuỗi ngày</span>
          <strong class="stat-value" data-field="streak"></strong>
        </div>
      </div>

      <section class="progress-section">
        <h2 class="section-title">Tiến độ theo chủ đề</h2>
        <div class="table-wrap">
          <table class="progress-table">
            <thead>
              <tr>
                <th>Chủ đề</th>
                <th>Đã học</th>
                <th>Đã thuộc</th>
                <th>Mức độ</th>
              </tr>
            </thead>
            <tbody data-field="topic-table"></tbody>
          </table>
        </div>
      </section>

      <section class="progress-section">
        <h2 class="section-title">Từ hay nhầm</h2>
        <ul class="word-list" data-field="hard-list"></ul>
      </section>

      <section class="progress-section">
        <h2 class="section-title">Cài đặt học tập</h2>
        <form class="settings-form" data-field="settings">
          <label class="setting-field">
            <span>Mục tiêu mỗi ngày (số lượt)</span>
            <input type="number" name="dailyGoal" min="5" max="100">
          </label>
          <label class="setting-field">
            <span>Giọng đọc tiếng Anh</span>
            <select name="voice"></select>
          </label>
          <label class="setting-field">
            <span>Tốc độ đọc</span>
            <input type="range" name="rate" min="0.6" max="1.2" step="0.1">
          </label>
        </form>
      </section>

      <section class="progress-section">
        <h2 class="section-title">Sao lưu dữ liệu</h2>
        <div class="backup-row">
          <button type="button" class="btn btn-secondary" data-action="export">Xuất tiến độ</button>
          <label class="file-label">
            <span>Nhập tiến độ từ file</span>
            <input type="file" data-field="import" accept=".json,application/json">
          </label>
          <button type="button" class="btn btn-danger" data-action="reset">Xóa toàn bộ tiến độ</button>
        </div>
      </section>

      <section class="progress-section">
        <h2 class="section-title">Ghi chú nội dung</h2>
        <ul class="corrections-list" data-field="corrections"></ul>
      </section>
    </section>
  </template>

  <template id="tpl-progress-row">
    <tr>
      <td data-field="topic"></td>
      <td data-field="learned"></td>
      <td data-field="mastered"></td>
      <td>
        <div class="meter" data-field="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="meter-fill" data-fill></span></div>
      </td>
    </tr>
  </template>
</body>
</html>
